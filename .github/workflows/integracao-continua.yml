name: CI Voll Med

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Configura JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Ajusta imagem Java para o build
        run: sed -i 's|^FROM openjdk:17$|FROM eclipse-temurin:17-jdk|' Dockerfile
        
    - name: Inicia serviços
      run: docker compose up -d

    - name: Roda Docker Compose
      run: docker-compose up -d

    - name: Executa testes Unitarios
      run: mvn -B verify
